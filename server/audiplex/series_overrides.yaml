# Manual series assignments for books where embedded tags and OpenLibrary
# don't provide series info. Matched by title (case-insensitive).
# Author is optional, used for disambiguation.
overrides:
  - title: "Apex"
    author: "Ramez Naam"
    series: "Nexus"
    sequence: "3"
  # #5478: Audible tags only Quicksilver as Book One; the rest of the Baroque
  # Cycle carries no parseable series, so a Series view showed one book.
  # Sequence follows Audible's split (Confusion = Books 4&5, System = 6-8).
  - title: "King of the Vagabonds"
    author: "Neal Stephenson"
    series: "Baroque Cycle"
    sequence: "2"
  - title: "Odalisque"
    author: "Neal Stephenson"
    series: "Baroque Cycle"
    sequence: "3"
  - title: "The Confusion"
    author: "Neal Stephenson"
    series: "Baroque Cycle"
    sequence: "4"
  - title: "The System of the World"
    author: "Neal Stephenson"
    series: "Baroque Cycle"
    sequence: "6"
